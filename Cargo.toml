[package]
name = "scapi"
version = "0.3.0"
edition = "2021"
default-run = "scapi-cli"

[features]
default = ["wallet-connect"]
wallet-connect = ["dep:walletconnect-sdk"]

[dependencies]
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
anyhow = "1.0"
base64 = { version = "0.22" }
wasm-bindgen = "0.2.105"
uuid = { version = "1.11", features = ["v4", "serde", "js"] }
thiserror = "2.0"
tracing = "0.1"
rand = "0.9.2"
tracing-subscriber = { version = "0.3", optional = true }
qr2term = { version = "0.3", optional = true }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
tiny-keccak = { version = "2.0", default-features = false, features = ["k12"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing-subscriber = "0.3"
qr2term = "0.3"
walletconnect-sdk = { version = "0.2.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }   
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.3.4", features = ["wasm_js"] }
qrcode = "0.14"

[dev-dependencies]

[profile.release]
lto = "thin"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "scapi-cli"
path = "src/main.rs"
required-features = ["wallet-connect"]

[[example]]
name = "wallet_connect_basic"
required-features = ["wallet-connect"]

[[example]]
name = "wallet_connect_events"
required-features = ["wallet-connect"]

[[example]]
name = "wallet_connect_transaction"
required-features = ["wallet-connect"]

[target.x86_64-unknown-linux-gnu.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }
